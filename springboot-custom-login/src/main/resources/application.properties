spring.application.name=custom-login
server.port=8081

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===== Database (H2 in-memory, doi sang SQL Server neu can) =====
spring.datasource.url=jdbc:h2:mem:customlogin;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Neu dung SQL Server, comment 5 dong H2 phia tren va mo cac dong duoi day:
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=customlogin;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8
# spring.datasource.username=sa
# spring.datasource.password=your_password
# spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Encoding =====
spring.servlet.encoding.enabled=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
