<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - UTEShop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="logo">UTEShop</div>
    <h2>Tạo tài khoản mới</h2>

    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" th:value="${user.username}" required>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" th:value="${user.email}" required>
        </div>
        <div class="field">
            <label for="fullName">Họ tên</label>
            <input id="fullName" type="text" name="fullName" th:value="${user.fullName}" required>
        </div>
        <div class="field">
            <label for="phone">Số điện thoại</label>
            <input id="phone" type="text" name="phone" th:value="${user.phone}">
        </div>
        <div class="field">
            <label for="password">Mật khẩu</label>
            <input id="password" type="password" name="password" required>
        </div>
        <div class="field">
            <label for="confirmPassword">Nhập lại mật khẩu</label>
            <input id="confirmPassword" type="password" name="confirmPassword" required>
        </div>

        <button type="submit" class="btn-primary">Đăng ký</button>
    </form>

    <div class="demo-hint">
        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
    </div>
</div>

</body>
</html>
