<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - UTEShop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="logo">UTEShop</div>
    <h2>Khôi phục mật khẩu</h2>
    <p class="demo-hint">Nhập username và email đã đăng ký, hệ thống sẽ cấp cho bạn một mật khẩu tạm thời.</p>

    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" required autofocus>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" required>
        </div>

        <button type="submit" class="btn-primary">Lấy mật khẩu tạm thời</button>
    </form>

    <div class="demo-hint">
        <a th:href="@{/login}">Quay lại đăng nhập</a>
    </div>
</div>

</body>
</html>
