<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Đơn hàng của tôi</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container">
        <h1>Đơn hàng của tôi</h1>

        <div th:if="${orders.content.size() == 0}">
            <p>Bạn chưa có đơn hàng nào. <a th:href="@{/products}">Mua sắm ngay</a></p>
        </div>

        <table class="data-table" th:if="${orders.content.size() > 0}">
            <thead>
            <tr>
                <th>Mã đơn</th>
                <th>Ngày đặt</th>
                <th>Tổng tiền</th>
                <th>Trạng thái</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders.content}">
                <td th:text="${o.orderCode}">DH123</td>
                <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                <td th:text="${#numbers.formatInteger(o.totalAmount, 0, 'POINT')} + ' đ'">0 đ</td>
                <td><span class="status-badge" th:classappend="${'status-' + o.status}" th:text="${o.status}">PENDING</span></td>
                <td><a th:href="@{/account/orders/{id}(id=${o.id})}" class="btn-small">Chi tiết</a></td>
            </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${orders.totalPages > 1}">
            <a th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
               th:href="@{/account/orders(page=${i})}"
               th:text="${i + 1}"
               th:classappend="${i == orders.number} ? 'active' : ''"
               class="page-link">1</a>
        </div>
    </div>
</main>
</body>
</html>
