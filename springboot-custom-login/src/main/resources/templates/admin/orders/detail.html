<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Chi tiết đơn hàng</title>
</head>
<body>
<main layout:fragment="content">
    <h1>Đơn hàng <span th:text="${order.orderCode}">DH123</span></h1>

    <div class="alert success" th:if="${message}" th:text="${message}"></div>

    <p>Khách hàng: <span th:text="${order.user.fullName}">-</span> (<span th:text="${order.user.username}">-</span>)</p>
    <p>Người nhận: <span th:text="${order.receiverName}">-</span> · <span th:text="${order.phone}">-</span></p>
    <p>Địa chỉ: <span th:text="${order.address}">-</span></p>
    <p>Phương thức thanh toán: <span th:text="${order.paymentMethod}">-</span></p>
    <p th:if="${order.note}">Ghi chú: <span th:text="${order.note}">-</span></p>

    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="filter-bar">
        <select name="status">
            <option th:each="s : ${statuses}" th:value="${s}" th:selected="${order.status == s}" th:text="${s}">PENDING</option>
        </select>
        <button type="submit" class="btn-primary">Cập nhật trạng thái</button>
    </form>

    <table class="data-table">
        <thead>
        <tr>
            <th>Sản phẩm</th>
            <th>Phân loại</th>
            <th>Đơn giá</th>
            <th>SL</th>
            <th>Thành tiền</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.productName}">Tên sản phẩm</td>
            <td>
                <span th:if="${item.size}" th:text="'Size: ' + ${item.size}">Size: M</span>
                <span th:if="${item.color}" th:text="' · Màu: ' + ${item.color}"> · Màu: Đen</span>
            </td>
            <td th:text="${#numbers.formatInteger(item.price, 0, 'POINT')} + ' đ'">0 đ</td>
            <td th:text="${item.quantity}">1</td>
            <td th:text="${#numbers.formatInteger(item.price * item.quantity, 0, 'POINT')} + ' đ'">0 đ</td>
        </tr>
        </tbody>
    </table>

    <div class="cart-total">Tổng cộng: <strong th:text="${#numbers.formatInteger(order.totalAmount, 0, 'POINT')} + ' đ'">0 đ</strong></div>
</main>
</body>
</html>
